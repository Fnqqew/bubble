[project]
name = "bubble"
version = "3.4.0"
description = "Traductor en tiempo real para Roblox: el chat, las burbujas, lo que escribís y la voz, con la suscripción de Claude del jugador."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "lingua-language-detector>=2.2",
    "Pillow>=11",
    "mss>=10",
    "dxcam>=0.3",  # captura de pantalla por GPU (DXGI): mucho menos CPU
    "comtypes>=1.4",
    "sv-ttk>=2.6",  # tema oscuro de Windows 11 para la ventana
    "numpy>=2",
    "scipy>=1.14",
    "winrt-runtime>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
    "winrt-Windows.Globalization>=3.2",
    "winrt-Windows.Graphics.Imaging>=3.2",
    "winrt-Windows.Media.Ocr>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
]

[project.optional-dependencies]
# Voz: reconocimiento de voz local (Whisper), voces sintéticas locales (Piper) y audio de Windows.
# websockets: Bubble Pro (la voz entendida en la nube, en vivo).
voz = ["faster-whisper>=1.2", "piper-tts>=1.3", "soundcard>=0.4", "websockets>=14"]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]
# Pruebas con grabaciones de Roblox (python -m bubble.tools.recording_lab) y el GIF del README: ffmpeg incluido.
pruebas = ["imageio-ffmpeg>=0.5"]

[project.scripts]
bubble = "bubble.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bubble = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
